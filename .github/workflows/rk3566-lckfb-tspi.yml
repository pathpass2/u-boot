name: Build rk3566-lckfb-tspi-u-boot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Source tag to build (optional)'
        required: false
        type: string

env:
  SRC_PATH: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag || github.ref }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Fix Script Permissions
        run: |
          chmod +x arch/arm/mach-rockchip/make_fit_atf.py
          chmod +x rk3566-atf-bl31 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            u-boot-tools \
            libssl-dev \
            bc \
            flex \
            bison \
            libncurses-dev \
            initramfs-tools \
            busybox-static \
            python3-pyelftools \
            libgnutls28-dev
          sudo -E apt-get -y install $(curl -fsSL https://tinyurl.com/ubuntu2204-build-armbian)

      - name: Setup ARM Toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Get u-boot version
        run: |
          UBUNTU_VERSION=$(make -s ubootversion 2>/dev/null || echo "unknown")
          echo "u-boot_version=${UBUNTU_VERSION}" >> $GITHUB_ENV
          # 修复：正确的命令替换语法，且使用 rk3566 前缀
          echo "release_tag=rk3566-lckfb-tspi-v${UBUNTU_VERSION}" >> $GITHUB_ENV
          echo "build_date=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Build u-boot.itb and idbloader.img
        run: |
          make ARCH=arm CROSS_COMPILE=aarch64-none-linux-gnu- lckfb-tspi-rk3566_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-none-linux-gnu- \
            BL31=./rk3566-atf-bl31 \
            ROCKCHIP_TPL=./rkbin/bin/rk35/rk3566_ddr_1056MHz_v1.16.bin \
            -j$(nproc)
          cat spl/u-boot-spl.bin > idbloader.img
          
          # 重命名产物以便更好识别
          cp u-boot.itb u-boot-${release_tag}.itb
          cp idbloader.img idbloader-${release_tag}.img

      - name: Upload u-boot.itb、idbloader.img
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.release_tag }}
          name: "rk3566-lckfb-tspi u-boot ${{ env.u-boot_version }}"
          artifacts: |
            u-boot-*.itb
            idbloader-*.img
          body: |
            ## 适用于 rk3566-lckfb-tspi 的主线 u-boot
            
            - **平台**: rk3566-lckfb-tspi
            - **源码 tag**: ${{ github.event.inputs.target_tag || github.sha }}
            - **u-boot 版本**: ${{ env.u-boot_version }}
            - **构建时间**: ${{ env.build_date }}
            
            
            ### DDR 固件
            - 使用 `rk3566_ddr_1056MHz_v1.16.bin`
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: false  # 修复：正确的参数名
